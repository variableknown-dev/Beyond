<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d0f14">
    <title>Kashvi is temporarily unavailable</title>
    <style>
        :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #0d0f14; color: #f3f4f8; }
        main { width: min(100%, 560px); padding: 36px; border: 1px solid #292e3a; border-radius: 20px; background: #171a23; text-align: center; }
        .mark { display: grid; width: 56px; height: 56px; margin: 0 auto 22px; place-items: center; border-radius: 18px; background: linear-gradient(145deg, #a795ff, #6552c8); font-size: 25px; font-weight: 700; }
        h1 { margin: 0 0 12px; font-size: clamp(23px, 5vw, 30px); }
        p { margin: 0; color: #b7bdca; line-height: 1.7; }
    </style>
</head>
<body>
    <main role="alert">
        <div class="mark" aria-hidden="true">K</div>
        <h1>Kashvi is temporarily unavailable</h1>
        <p>Sorry, but we are currently experiencing a few errors in our code. We are working to resolve them promptly. We apologize for the inconvenience.</p>
    </main>
</body>
</html>
